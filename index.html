
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficios Religiosos - IMMB</title>
  <link rel="manifest" href="manifest.json">
  <!-- React, Babel y Supabase CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 650px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .nav-bar { display: flex; justify-content: space-around; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; flex-wrap: wrap; gap: 5px; }
    .nav-btn { background: none; border: none; font-size: 15px; font-weight: bold; color: #555; cursor: pointer; padding: 8px; }
    .nav-btn.active { color: #0f4c5c; border-bottom: 3px solid #0f4c5c; }
    .card { background: #fafafa; border: 1px solid #e0e0e0; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    .label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; }
    .input-field { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .btn-primary { width: 100%; padding: 10px; background-color: #0f4c5c; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 15px; }
    .btn-primary:hover { background-color: #0b3844; }
    .section-title { color: #0f4c5c; border-bottom: 1px solid #ddd; padding-bottom: 5px; margin-top: 20px; }
    .header-user { display: flex; justify-content: space-between; align-items: center; background: #eef2f3; padding: 10px; border-radius: 6px; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div id="root">Cargando aplicación...</div>
  <script type="text/babel">
    var SUPABASE_URL = 'https://pyijfvcpdvibocatstak.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_3aLRXF3ttPSb5WZM6p8vcw_hn1na3U1';
    
    var supabaseClient = (window.supabase && window.supabase.createClient) 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) 
      : null;
    function Login(props) {
      var setUsuario = props.setUsuario;
      var sUser = React.useState(''); var user = sUser[0]; var setUser = sUser;
      var sPass = React.useState(''); var pass = sPass[0]; var setPass = sPass;
      function iniciarSesion(e) {
        e.preventDefault();
        if (!supabaseClient) return;
        supabaseClient
          .from('usuarios_sistema')
          .select('*')
          .eq('usuario', user.trim())
          .eq('password', pass.trim())
          .single()
          .then(function(res) {
            if (res.data) {
              setUsuario(res.data);
            } else {
              alert('Usuario o contraseña incorrectos');
            }
          })
          .catch(function(err) {
            alert('Error al conectar: ' + err.message);
          });
      }
      return (
        <div className="container">
          <h2>Iglesia Mundial del Mesías Bolivia</h2>
          <h3>Control Administrativo y Oficios Religiosos</h3>
          <form onSubmit={iniciarSesion} className="card">
            <span className="label">Usuario:</span>
            <input className="input-field" value={user} onChange={function(e){ setUser(e.target.value); }} required />
            <span className="label">Contraseña:</span>
            <input className="input-field" type="password" value={pass} onChange={function(e){ setPass(e.target.value); }} required />
            <button className="btn-primary" type="submit">Ingresar al Sistema</button>
          </form>
        </div>
      );
    }
    function FormularioSolicitud(props) {
      var usuario = props.usuario;
      var iglesias = props.iglesias;
      var sSolicitante = React.useState(''); var solicitante = sSolicitante[0]; var setSolicitante = sSolicitante;
      var sAntepasados = React.useState(''); var antepasados = sAntepasados[0]; var setAntepasados = sAntepasados;
      var sTipo = React.useState('Culto de Gratitud'); var tipo = sTipo[0]; var setTipo = sTipo;
      var sIgl = React.useState(usuario.iglesia_id || (iglesias[0] && iglesias[0].id) || ''); var iglesiaId = sIgl[0]; var setIglesiaId = sIgl;
      function guardar(e) {
        e.preventDefault();
        if (!supabaseClient) return;
        supabaseClient.from('solicitudes_culto').insert([{
          solicitante: solicitante.trim(),
          antepasados: antepasados.trim(),
          tipo_oficio: tipo,
          iglesia_id: iglesiaId
        }]).then(function(res) {
          if (res.error) {
            alert('Error al registrar la solicitud: ' + res.error.message);
          } else {
            alert('Solicitud registrada exitosamente');
            setSolicitante('');
            setAntepasados('');
          }
        });
      }
      return (
        <form onSubmit={guardar} className="card">
          <h3>Nueva Solicitud de Oficio Religioso</h3>
          
          <span className="label">Solicitante:</span>
          <input className="input-field" placeholder="Nombre completo del solicitante" value={solicitante} onChange={function(e){ setSolicitante(e.target.value); }} required />
          <span className="label">Antepasados / Intención:</span>
          <textarea className="input-field" rows="3" placeholder="Detalle de antepasados o intenciones del culto" value={antepasados} onChange={function(e){ setAntepasados(e.target.value); }} required></textarea>
          <span className="label">Tipo de Oficio:</span>
          <select className="input-field" value={tipo} onChange={function(e){ setTipo(e.target.value); }}>
            <option value="Culto de Gratitud">Culto de Gratitud</option>
            <option value="Suplicación Escrita">Suplicación Escrita</option>
            <option value="Culto Mensual">Culto Mensual</option>
            <option value="Oficio Especial">Oficio Especial</option>
          </select>
          <span className="label">Iglesia Asignada:</span>
          <select className="input-field" value={iglesiaId} onChange={function(e){ setIglesiaId(e.target.value); }} disabled={usuario.rol !== 'administrador'}>
            {iglesias.map(function(i) {
              return <option key={i.id} value={i.id}>{i.nombre}</option>;
            })}
          </select>
          <button className="btn-primary" type="submit">Registrar Solicitud</button>
        </form>
      );
    }
    function ListaSolicitudes(props) {
      var usuario = props.usuario;
      var sSol = React.useState([]); var solicitudes = sSol[0]; var setSolicitudes = sSol;
      React.useEffect(function() {
        if (!supabaseClient) return;
        var query = supabaseClient.from('solicitudes_culto').select('*, iglesias(nombre)');
        
        if (usuario.rol !== 'administrador') {
          query = query.eq('iglesia_id', usuario.iglesia_id);
        }
        
        query.then(function(res) {
          if (res.data) setSolicitudes(res.data);
        });
      }, [usuario]);
      return (
        <div>
          <h3>Lista de Solicitudes Registradas</h3>
          {solicitudes.length === 0 ? <p>No hay solicitudes registradas para esta iglesia.</p> : (
            solicitudes.map(function(s) {
              return (
                <div key={s.id} className="card">
                  <strong>Solicitante:</strong> {s.solicitante}<br/>
                  <strong>Oficio:</strong> {s.tipo_oficio}<br/>
                  <strong>Antepasados/Intención:</strong> {s.antepasados}<br/>
                  <small><strong>Iglesia:</strong> {s.iglesias ? s.iglesias.nombre : 'General'}</small>
                </div>
              );
            })
          )}
        </div>
      );
    }
    function GestionAdmin(props) {
      var iglesias = props.iglesias;
      var setIglesias = props.setIglesias;
      var alActualizar = props.alActualizar;
      var sNuevaIgl = React.useState(''); var nuevaIglesia = sNuevaIgl[0]; var setNuevaIglesia = sNuevaIgl;
      var sNombreResp = React.useState(''); var nombreResp = sNombreResp[0]; var setNombreResp = sNombreResp;
      var sUserResp = React.useState(''); var userResp = sUserResp[0]; var setUserResp = sUserResp;
      var sPassResp = React.useState(''); var passResp = sPassResp[0]; var setPassResp = sPassResp;
      var sIglResp = React.useState(''); var iglesiaRespId = sIglResp[0]; var setIglesiaRespId = sIglResp;
      React.useEffect(function() {
        if (iglesias.length > 0 && !iglesiaRespId) {
          setIglesiaRespId(iglesias[0].id);
        }
      }, [iglesias]);
      function agregarIglesia(e) {
        e.preventDefault();
        var nombreLimpio = nuevaIglesia.trim();
        if (!nombreLimpio || !supabaseClient) return;
        supabaseClient
          .from('iglesias')
          .insert([{ nombre: nombreLimpio }])
          .select()
          .single()
          .then(function(res) {
            if (res.data) {
              setNuevaIglesia('');
              alert('Iglesia registrada correctamente: ' + res.data.nombre);
              setIglesiaRespId(res.data.id);
              if (alActualizar) alActualizar();
            } else if (res.error) {
              alert('Error al agregar iglesia: ' + res.error.message);
            }
          })
          .catch(function(err) { alert('Error: ' + err.message); });
      }
      function agregarResponsable(e) {
        e.preventDefault();
        var idFinalIglesia = iglesiaRespId || (iglesias[0] && iglesias[0].id);
        if (!idFinalIglesia || !supabaseClient) {
          alert('Por favor registra o selecciona una iglesia primero');
          return;
        }
        supabaseClient.from('usuarios_sistema').insert([{
          nombre: nombreResp.trim(),
          usuario: userResp.trim(),
          password: passResp.trim(),
          rol: 'responsable',
          iglesia_id: idFinalIglesia
        }]).then(function(res) {
          if (res.error) {
            alert('Error al guardar responsable: ' + res.error.message);
          } else {
            setNombreResp(''); setUserResp(''); setPassResp('');
            alert('Usuario Responsable registrado con éxito');
          }
        });
      }
      return (
        <div>
          <h3 className="section-title">AGREGAR NUEVA IGLESIA</h3>
          <form onSubmit={agregarIglesia} className="card">
            <span className="label">Nombre de la Iglesia:</span>
            <input className="input-field" placeholder="Ej: Iglesia La Paz" value={nuevaIglesia} onChange={function(e){ setNuevaIglesia(e.target.value); }} required />
            <button className="btn-primary" type="submit">Agregar Iglesia</button>
          </form>
          <h3 className="section-title">AGREGAR RESPONSABLE DE IGLESIA</h3>
          <form onSubmit={agregarResponsable} className="card">
            <span className="label">Nombre Completo:</span>
            <input className="input-field" placeholder="Ej: Pedro Gonzales" value={nombreResp} onChange={function(e){ setNombreResp(e.target.value); }} required />
            <span className="label">Nombre de Usuario:</span>
            <input className="input-field" placeholder="Ej: admin_paz" value={userResp} onChange={function(e){ setUserResp(e.target.value); }} required />
            <span className="label">Contraseña:</span>
            <input className="input-field" type="password" placeholder="Escriba la contraseña" value={passResp} onChange={function(e){ setPassResp(e.target.value); }} required />
            <span className="label">Asignar Iglesia:</span>
            <select className="input-field" value={iglesiaRespId} onChange={function(e){ setIglesiaRespId(e.target.value); }}>
              {iglesias.length === 0 ? (
                <option value="">Sin iglesias registradas</option>
              ) : (
                iglesias.map(function(i){ return <option key={i.id} value={i.id}>{i.nombre}</option>; })
              )}
            </select>
            <button className="btn-primary" type="submit">Crear Usuario Responsable</button>
          </form>
        </div>
      );
    }
    function App() {
      var sUser = React.useState(null); var usuario = sUser[0]; var setUsuario = sUser;
      var sVista = React.useState('solicitudes'); var vista = sVista[0]; var setVista = sVista;
      var sIgl = React.useState([]); var iglesias = sIgl[0]; var setIglesias = sIgl;
      function cargarIglesias() {
        if (!supabaseClient) return;
        supabaseClient.from('iglesias').select('*').then(function(res) {
          if (res.data) setIglesias(res.data);
        });
      }
      React.useEffect(function() {
        cargarIglesias();
      }, []);
      if (!usuario) {
        return <Login setUsuario={setUsuario} />;
      }
      return (
        <div className="container">
          <div className="header-user">
            <div>
              <strong>Usuario:</strong> {usuario.nombre}<br/>
              <small><strong>Rol:</strong> {usuario.rol}</small>
            </div>
            <button onClick={function(){ setUsuario(null); }} style={{background: '#d9534f', color: 'white', border: 'none', padding: '5px 10px', borderRadius: '4px', cursor: 'pointer'}}>
              Cerrar Sesión
            </button>
          </div>
          <div className="nav-bar">
            <button className={'nav-btn ' + (vista === 'solicitudes' ? 'active' : '')} onClick={function(){ setVista('solicitudes'); }}>
              Solicitudes
            </button>
            <button className={'nav-btn ' + (vista === 'formulario' ? 'active' : '')} onClick={function(){ setVista('formulario'); }}>
              Nueva Solicitud
            </button>
            {usuario.rol === 'administrador' && (
              <button className={'nav-btn ' + (vista === 'admin' ? 'active' : '')} onClick={function(){ setVista('admin'); }}>
                Gestión Admin
              </button>
            )}
          </div>
          {vista === 'solicitudes' && <ListaSolicitudes usuario={usuario} />}
          {vista === 'formulario' && <FormularioSolicitud usuario={usuario} iglesias={iglesias} />}
          {vista === 'admin' && usuario.rol === 'administrador' && (
            <GestionAdmin iglesias={iglesias} setIglesias={setIglesias} alActualizar={cargarIglesias} />
          )}
        </div>
      );
    }
    var root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
